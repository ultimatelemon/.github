name: Code Quality

on:
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ultimatelemon/shared-actions/.github/workflows/node-quality.yml@v2
    permissions:
      contents: read
    # Every check runs only when its script exists in package.json:
    # lint, format:check, typecheck, test, build and verify.
